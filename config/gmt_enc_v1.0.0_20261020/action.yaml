igris_c_inference_actions:
  # Apply GMR targets last to override policy targets for the selected joints.
  apply_order: [joint_position, motion_command]
  terms:
    joint_position:
      function: safe_joint_position
      output: actions
      params:
        unselected_joint_behavior: hold_current
        # Reproduce the legacy GMT recovery behavior. Parallel joints remain under
        # the controller-side coupling constraints.
        position_limit_recovery:
          soft_limit_ratio: 0.8
          excluded_joints: [WR, WP, LAP, LAR, RAP, RAR]

      action_joints: [LSP, RSP, WY, LSR, RSR, WR, LSY, RSY, WP, LEP, REP, LHP, RHP, LHR, RHR, LHY, RHY, LKP, RKP, LAP, RAP, LAR, RAR]
