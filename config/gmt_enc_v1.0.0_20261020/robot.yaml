igris_c_inference_robot:
  imu:
    base_to_imu_rpy: [0.0, -1.5707963267948966, 0.0]
    gravity_direction: [0.0, 0.0, -1.0]

  # waist, left ankle, right ankle, left wrist, right wrist
  kinematic_modes: [PJS, PJS, PJS, PJS, PJS]

  # This is always the complete 31-joint SDK model. robot_index covers 0..30.
  # Unselected joints still use the defaults, limits, and gains defined here.
  # The empty base_link frame is the robot anchor used by the multi-motion
  # deployment contract; it denotes the base without any serial joint offset.
  frames:
    base_link:
      joints: []

  robot_joints:
    - {name: WY,  model_joint: Joint_Waist_Yaw,             robot_index: 0,  position_min: -1.53938040046, position_max: 1.53938040046, default_position: 0.0,  default_velocity: 0.0, default_torque: 0.0, default_kp: 121.51457,  default_kd: 6.077864}
